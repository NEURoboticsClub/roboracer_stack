# slam_toolbox profile for a DELIBERATE MAPPING LAP, not for racing.
#
# The racing profile (mapper_params_irl.yaml) has to keep up with a car doing
# ~3.2 m/s. This one assumes the car is crawling at ~1.1 m/s under
# neo_telemetry_mapping_launch.py, and spends the CPU that buys on a wider
# scan-match search and a denser pose graph. Do not use it while racing - the
# larger correlation window costs roughly twice the matching time per scan.
#
# TF chain (identical to the racing profile):
#   map -> odom -> base_link -> cloud
#   vesc_to_odom publishes       odom -> base_link
#   a static transform publishes base_link -> cloud
#   slam_toolbox publishes       map -> odom
#
# base_link is the REAR AXLE - that is the point vesc_to_odom's bicycle model
# integrates about. The scanner's forward offset from it lives in the
# base_link -> cloud static transform (the launch file's lidar_x argument). If
# that offset is wrong, NOTHING in this file will fix the double walls it
# causes: the error rotates with the car, so it only shows up as the car turns.
slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    use_sim_time: false
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    # A little slower than the racing profile: the wider search below costs more
    # per scan, and there is no reason to re-raster the grid five times a second
    # when the car is only covering ~1.1 m in that time.
    map_update_interval: 0.3
    resolution: 0.05
    max_laser_range: 20.0
    # Let more scans into the graph than the racing profile's 0.2 s. At 1.1 m/s
    # that is a keyframe roughly every 0.11 m of travel, so consecutive scans
    # overlap heavily and each match is a small correction.
    minimum_time_interval: 0.1
    transform_timeout: 0.3
    # How many scans the tf2 message filter may hold while it waits for the
    # matching odom -> base_link transform. slam_toolbox defaults this to 1, and
    # 1 only works if odometry is stamped at or AHEAD of the scan it came from.
    #
    # Measured on this car: rf2o stamps its transform a median 0.123 s (max
    # 0.145 s) BEHIND the scan it was computed from, which is about two scan
    # periods at 15 Hz. With a queue of 1, the next scan evicts the one still
    # waiting before its transform ever arrives, so essentially every scan is
    # thrown away - "discarding message because the queue is full" - and the map
    # advances only on the rare scan that happens to squeak through. 10 slots is
    # 0.67 s of buffer at 15 Hz, comfortably more than the wait needs.
    #
    # vesc_to_odom does not need this: it stamps its transform with now(), which
    # is always ahead of the scan. Keep it anyway so switching odom_source does
    # not silently break mapping.
    scan_queue_size: 10
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    # Denser than the racing profile (0.2 / 0.17). Driving slowly is only half
    # the benefit of a mapping lap; the other half is spending the extra time on
    # more keyframes, so drift never accumulates far between corrections.
    minimum_travel_distance: 0.15
    # ~5.7 deg. Denser through corners than the racing profile's 0.17, because
    # rotation is where the error enters: more nodes per corner means more
    # constraints on the turn, so less of it can accumulate unobserved between
    # keyframes.
    minimum_travel_heading: 0.10
    scan_buffer_size: 30
    scan_buffer_maximum_scan_distance: 20.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    # Reach far enough to find the start/finish node again DESPITE the drift.
    #
    # This is measured, not guessed: slam_diag.py showed the graph accumulating
    # ~20 deg of heading error per lap while every correction step in map->odom
    # stayed under 2.6 deg. That is the signature of loop closure never firing -
    # incremental scan matching nibbling at the error while the lap never closes.
    # A closure would step by the whole accumulated drift at once.
    #
    # The reason it cannot fire is that candidates are searched around the
    # CURRENT (drifted) estimate. 20 deg of heading error puts the far side of a
    # 10 m track several metres from where the graph thinks it is, so a 6 m
    # search never reaches the node it needs to match against.
    loop_search_maximum_distance: 12.0
    do_loop_closing: true
    # Chain size stays at 10 ON PURPOSE. It is the main guard against a FALSE
    # closure, which is far worse than no closure: matching the wrong pair folds
    # the whole map onto itself and the run is unrecoverable. Loosen the response
    # thresholds if closures still will not fire, but leave this alone.
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    # Slightly more permissive than the racing values (0.35 / 0.45) so a match
    # degraded by 20 deg of misalignment still clears the bar.
    loop_match_minimum_response_coarse: 0.30
    loop_match_minimum_response_fine: 0.40

    # Correlation Parameters - Correlation Parameters
    #
    # 1.0 m of search window, up from the racing profile's 0.7. This is the
    # single most useful knob against "the map lost track": VESC odometry is
    # dead reckoning off the COMMANDED steering angle, so it is worst exactly
    # where it matters - mid-corner, when tyre slip and servo lag mean the wheels
    # were never where we told them to be. A window that does not reach as far as
    # the prior is wrong cannot find the true alignment, and the scan gets
    # welded into the graph at the wrong pose. That is what stacks walls.
    correlation_search_space_dimension: 1.0
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlation Parameters - Loop Closure Parameters
    # Must cover the POSITIONAL error at the closure point, for the same reason
    # loop_search_maximum_distance had to grow.
    loop_search_space_dimension: 12.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    #
    # Variances that penalize a match disagreeing with the odometry prior, so
    # BIGGER trusts the prior LESS. These sit at the slam_toolbox defaults, same
    # as the racing profile: VESC dead reckoning has no gyro and no wheel-slip
    # detection, so the scan matcher should win arguments with it.
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.524    # ~30 deg
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
